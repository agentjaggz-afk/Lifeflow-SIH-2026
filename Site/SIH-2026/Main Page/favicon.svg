<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- LifeFlow Crimson Base Gradient -->
    <linearGradient id="crimsonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Frosted Glass Overlay Gradient -->
    <linearGradient id="frostGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Frosted Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="dropletShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base: LifeFlow Crimson Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="140" fill="url(#crimsonGradient)"/>

  <!-- Frosted Glass Container (.logo-drop style) -->
  <rect x="40" y="40" width="432" height="432" rx="116" 
        fill="url(#frostGradient)" 
        stroke="url(#borderGradient)" 
        stroke-width="12"
        filter="url(#badgeShadow)"/>

  <!-- Specular Top-Left Highlight Accent -->
  <path d="M 120 54 Q 256 46 392 54" stroke="rgba(255,255,255,0.4)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- LifeFlow Droplet Icon (Centered & Scaled) -->
  <!-- Base fa-droplet: 384 x 512. Scaled to width 210, height 280, centered at (256, 260) -->
  <g transform="translate(151, 120) scale(0.546875)" filter="url(#dropletShadow)">
    <path d="M192 512C86 512 0 426 0 320C0 228.8 130.2 57.7 166.6 11.7C172.9 3.8 182.3 0 192 0C201.7 0 211.1 3.8 217.4 11.7C253.8 57.7 384 228.8 384 320C384 426 298 512 192 512Z" 
          fill="#ffffff"/>
    <!-- Internal droplet curved shine -->
    <path d="M 110 320 C 110 370 145 420 180 435 C 160 425 140 375 140 325 C 140 260 185 150 188 135 C 175 160 110 250 110 320 Z" 
          fill="rgba(255, 255, 255, 0.45)"/>
  </g>
</svg>
